plugins {
    id "com.android.application"
}

android {
    namespace "id.lestari.mobile"
    compileSdk 36

    defaultConfig {
        applicationId "id.lestari.mobile"
        minSdk 35
        targetSdk 36
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Intentionally no `dependencies { }`: the app uses only the Android platform (no AndroidX, no third-party libraries).
